name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git catch2 clang-tidy clang-format

      - name: Clone dependency
        run: |
          git clone https://github.com/ivanenko/vCard external/librepo

      - name: Patch Catch2 issue
        run: |
          sed -i '/add_subdirectory(test)/d' external/librepo/CMakeLists.txt

      - name: Build dependency
        run: |
          cmake -S external/librepo -B external/librepo/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$HOME/.local

          cmake --build external/librepo/build
          cmake --install external/librepo/build

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_PREFIX_PATH=$HOME/.local \
            -DBUILD_QT_APP=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build

      - name: Build
        run: cmake --build build --target copy_resources

      - name: Run Tests
        run: cd tests && ctest --output-on-failure

      - name: Check formatting
        run: |
          cmake --build build --target format-check

      - name: Run clang-tidy
        run: |
          cmake --build build --target tidy-check
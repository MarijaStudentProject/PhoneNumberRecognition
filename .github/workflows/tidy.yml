name: Run clang tidy

on:
  push:
  pull_request:

jobs:
  clang_tidy:
    name: Clang Tidy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy cmake

      - name: Configure (generate compile_commands.json)
        run: cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -S . -B build

      - name: Run clang-tidy
        run: |
          cd build
          FILES=$(find ../src ../include -type f | grep -E '\.(cpp|hpp|c|h)$')
          for f in $FILES; do
            clang-tidy "$f" -quiet
          done
